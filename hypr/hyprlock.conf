general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.2

    fade_on_empty = false
    placeholder_text = <i>Password...</i>

    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 72

    position = 0, 100
    halign = center
    valign = center
}
