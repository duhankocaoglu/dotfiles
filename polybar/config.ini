[colors]
background = #1e1e2e
background-alt = #313244
foreground = #cdd6f4
primary = #89b4fa
secondary = #f38ba8
alert = #f38ba8
disabled = #6c7086

[bar/main]
width = 100%
height = 32
offset-x = 0
offset-y = 8
radius = 10
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
# uncomment for multiple bars across all monitors
# monitor = ${env:MONITOR:}

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=13;3"

modules-left = i3
modules-center = date
modules-right = eq-bars spotify xkeyboard wifi pulseaudio battery 

cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false

label-mode-padding = 2
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.primary}

label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 2
label-focused-underline = ${colors.secondary}

label-unfocused = %index%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/date]
click-left = notify-send "date clicked"
type = internal/date
interval = 1
date = %H:%M
date-alt = %A, %d %B %Y  %H:%M:%S
label = "  %date%"
label-foreground = ${colors.foreground}

[module/wifi]
type = internal/network
interface-type = wireless
interval = 3
format-connected = <label-connected>
format-connected-prefix = "󰤨 "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %{A1:${env:HOME}/.local/bin/networkmanager_dmenu &:}%essid%%{A}
format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰤭 "
format-disconnected-prefix-foreground = ${colors.disabled}
label-disconnected = %{A1:${env:HOME}/.local/bin/networkmanager_dmenu &:}disconnected%{A}
label-disconnected-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
label-volume = %percentage%%
format-muted = <label-muted>
format-muted-prefix = "󰝟 "
format-muted-prefix-foreground = ${colors.disabled}
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.secondary}
label-charging = %percentage%%

format-discharging = <label-discharging>
format-discharging-prefix = "󰁹 "
format-discharging-prefix-foreground = ${colors.primary}
label-discharging = %percentage%%

format-full = <label-full>
format-full-prefix = "󰂅 "
format-full-prefix-foreground = ${colors.secondary}
label-full = full

[settings]
screenchange-reload = true
pseudo-transparency = true



[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = "󰌌 "
format-prefix-foreground = ${colors.primary}

label-layout = %layout%
label-layout-foreground = ${colors.foreground}

label-indicator-on = %name%
label-indicator-on-foreground = ${colors.background}
label-indicator-on-background = ${colors.secondary}
label-indicator-on-padding = 1


[module/spotify]
type = custom/script
exec = playerctl --player=spotify metadata --format '{{ artist }} - {{ title }}' 2>/dev/null
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %output:0:40:...%
click-left = playerctl --player=spotify play-pause
scroll-up = playerctl --player=spotify next
scroll-down = playerctl --player=spotify previous


[module/eq-bars]
type = custom/script
exec = ~/.config/polybar/scripts/eq-bars.sh
interval = 0.2
format = <label>
format-foreground = ${colors.primary}
